id: launchpad_x
name: Novation Launchpad X
aliases: [launchpad, launchpad x]
port_match: ["LPX MIDI", "Launchpad X"]   # macOS shows "LPX MIDI In"/"Launchpad X LPX MIDI"
input_channel: 0
# Programmer mode: bottom-left pad = note 11, rows step by 10 (11-18, 21-28 ... 81-88)
pads: {layout: grid, rows: 8, cols: 8, base_note: 11, row_stride: 10}
led: {supported: true, channel: 0, colors: {"off": 0, loaded: 21, playing: 5, armed: 72}}
init_sysex:
  - [0x00, 0x20, 0x29, 0x02, 0x0C, 0x0E, 0x01]   # enter Programmer mode
verified: false
