name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core deps (no speech models, no rtmidi needed for tests)
        run: python -m pip install mido pyyaml pytest
      - name: Test
        run: python -m pytest -q
      - name: Dry-run smoke test
        run: python -m voice_midi --dry-run -q --no-update-check -c "load 808 kick on pad 3" -c "tempo one twenty eight"
